<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ShiftNinja</title>
  <link rel="stylesheet" href="wheel.css" />
</head>
<body>
  <div id="root">
    <div id="disk"></div>
    <div id="caustic"><i></i></div>
    <svg id="wheel" viewBox="0 0 320 320" width="320" height="320" aria-label="ShiftNinja">
      <defs>
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.95" />
          <stop offset="0.25" stop-color="#ff7ad9" stop-opacity="0.55" />
          <stop offset="0.5" stop-color="#7cc8ff" stop-opacity="0.35" />
          <stop offset="0.75" stop-color="#a98bff" stop-opacity="0.45" />
          <stop offset="1" stop-color="#ffd27a" stop-opacity="0.8" />
        </linearGradient>
        <radialGradient id="sheen" cx="0.38" cy="0.18" r="0.75">
          <stop offset="0" stop-color="#fff" stop-opacity="0.32" />
          <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="hub-glass" cx="0.4" cy="0.25" r="0.85">
          <stop offset="0" stop-color="#fff" stop-opacity="0.95" />
          <stop offset="1" stop-color="#fff" stop-opacity="0.55" />
        </radialGradient>
        <g id="petal-fills"></g>
      </defs>
      <circle id="sheen-disk" cx="160" cy="160" r="150" fill="url(#sheen)"></circle>
      <circle id="track" cx="160" cy="160" r="50"></circle>
      <g id="slices"></g>
      <path id="pointer" d=""></path>
      <circle id="hub" cx="160" cy="160" r="44"></circle>
      <circle id="progress" cx="160" cy="160" r="40" pathLength="100"></circle>
      <circle class="rim" cx="160" cy="160" r="44"></circle>
      <circle class="rim" cx="160" cy="160" r="149.25"></circle>
      <text id="hub-top" x="160" y="156" text-anchor="middle"></text>
      <text id="hub-bottom" x="160" y="174" text-anchor="middle"></text>
      <g id="dots"></g>
      <circle id="ripple" cx="160" cy="160" r="10"></circle>
    </svg>
  </div>
  <script src="wheel.js"></script>
</body>
</html>
